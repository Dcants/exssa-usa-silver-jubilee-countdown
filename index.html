<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8f0019">
  <meta name="description" content="EXSSA USA Silver Jubilee countdown to July 27, 2026.">
  <title>EXSSA USA Silver Jubilee Countdown</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell" aria-labelledby="page-title">
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <div class="sparkles" aria-hidden="true"></div>

    <section class="hero">
      <div class="logo-wrap" aria-label="EXSSA USA Silver Jubilee logo">
        <img id="event-logo" class="event-logo" alt="EXSSA USA Silver Jubilee logo">
      </div>

      <p class="eyebrow">Counting down to Monday, July 27, 2026</p>
      <h1 id="page-title">EXSSA USA SILVER JUBILEE</h1>
      <p class="subtitle">25 years of grace, impact, unity, and sisterhood.</p>

      <div class="countdown" role="timer" aria-live="polite" aria-label="Countdown to EXSSA USA Silver Jubilee">
        <article class="time-card" aria-label="Days remaining">
          <div class="flap" data-unit="days">
            <span id="days" class="number">000</span>
          </div>
          <span class="label">Days</span>
        </article>

        <article class="time-card" aria-label="Hours remaining">
          <div class="flap" data-unit="hours">
            <span id="hours" class="number">00</span>
          </div>
          <span class="label">Hours</span>
        </article>

        <article class="time-card" aria-label="Minutes remaining">
          <div class="flap" data-unit="minutes">
            <span id="minutes" class="number">00</span>
          </div>
          <span class="label">Minutes</span>
        </article>

        <article class="time-card" aria-label="Seconds remaining">
          <div class="flap" data-unit="seconds">
            <span id="seconds" class="number">00</span>
          </div>
          <span class="label">Seconds</span>
        </article>
      </div>

      <p id="status-message" class="status-message">The celebration begins when the clock strikes midnight.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
